    <script>

        theme: {

            animation: {
              'fade-in-stay': 'fadeInStay 1.2s ease-in-out forwards',

            keyframes: {

              'scroll-marquee': {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              bounceSubtle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            },
          },
